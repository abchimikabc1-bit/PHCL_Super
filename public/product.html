<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHCL Super – Product Details</title>
  <meta name="description" content="Explore detailed information about this premium product on PHCL Super. High‑quality images, price, and secure purchase options." />
  <meta property="og:title" content="PHCL Super – Product Details" />
  <meta property="og:description" content="Premium product showcase with escrow‑protected purchase flow." />
  <meta property="og:type" content="product" />
  <meta property="og:url" content="https://phclsuper.example.com/product.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(15, 23, 42, 0.9);
      --primary: #6366f1;
      --secondary: #10b981;
      --gold: #fde047;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-border: rgba(255,255,255,0.1);
      --glass-border-accent: rgba(99,102,241,0.3);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',sans-serif; background:var(--bg-dark); color:var(--text-main); line-height:1.6; }
    .skip-link { position:absolute; left:-999px; top:auto; width:1px; height:1px; overflow:hidden; }
    .skip-link:focus { left:0; top:0; width:auto; height:auto; background:#fff; color:#000; padding:0.5rem 1rem; z-index:1000; }
    header, nav, main, footer { padding:1rem; }
    .container { max-width:900px; margin:0 auto; background:var(--bg-card); backdrop-filter:blur(20px); border:1px solid var(--glass-border-accent); border-radius:16px; padding:2rem; box-shadow:0 20px 50px rgba(0,0,0,0.6); }
    .header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; border-bottom:1px solid var(--glass-border-accent); padding-bottom:1rem; margin-bottom:2rem; }
    h1 { font-family:'Outfit',sans-serif; font-size:2rem; font-weight:800; background:linear-gradient(135deg,#fff,#fff59d 30%,#fcd116 65%,#f59e0b 85%,#fff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .btn-back { background:rgba(99,102,241,0.2); border:1px solid var(--glass-border-accent); color:#fff; padding:0.5rem 1.2rem; border-radius:8px; text-decoration:none; font-weight:600; font-size:0.9rem; transition:background 0.25s; }
    .btn-back:hover { background:var(--primary); }
    .product-card { background:var(--bg-card); border:1px solid var(--glass-border); border-radius:12px; padding:1.5rem; box-shadow:0 15px 40px rgba(245,158,11,0.3); text-align:center; }
    .product-card img { max-width:100%; border-radius:8px; margin-bottom:1rem; }
    .product-card h2 { font-family:'Outfit',sans-serif; font-size:1.8rem; color:var(--gold); margin-bottom:0.5rem; }
    .price { font-size:1.4rem; color:var(--secondary); font-weight:600; margin-bottom:1rem; }
    .buy-btn { background:linear-gradient(135deg,var(--secondary),#059669); color:#fff; padding:0.8rem 1.6rem; border:none; border-radius:9999px; font-weight:600; cursor:pointer; transition:transform 0.2s; }
    .buy-btn:hover { transform:scale(1.05); }
    footer { margin-top:3rem; border-top:1px solid var(--glass-border); text-align:center; font-size:0.85rem; color:var(--text-muted); }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>
  <header class="header" role="banner">
    <div>
      <h1>📦 Product Details</h1>
    </div>
    <nav aria-label="Primary navigation">
      <select id="globalLangSelect" aria-label="Select language">
        <option value="en" selected>English</option>
        <option value="sw">Swahili</option>
        <option value="fr">Français</option>
      </select>
    </nav>
  </header>
  <main id="main" class="container" role="main">
    <a href="/" class="btn-back" aria-label="Back to home">⬅️ Home</a>
    <section id="productDetail" class="product-card" aria-live="polite">
      <div>Loading product details…</div>
    </section>
  </main>
  <footer class="footer" role="contentinfo">
    © 2026 PHCL Super – All Rights Reserved
  </footer>
  <script>
    // Simple static product catalogue (replace with real API in production)
    const catalogue = {
      '001': { name:'Product One', price:'TZS 15,000', img:'/product_placeholder_1786181033366.jpg', desc:'High‑quality item with premium features.' },
      '002': { name:'Product Two', price:'TZS 25,000', img:'/product_placeholder_1786181033366.jpg', desc:'Best‑selling product trusted by many.' },
      '003': { name:'Product Three', price:'TZS 35,000', img:'/product_placeholder_1786181033366.jpg', desc:'Exclusive limited‑edition offering.' }
    };
    function getQueryParam(name){ return new URLSearchParams(window.location.search).get(name); }
    const sku = getQueryParam('sku');
    const container = document.getElementById('productDetail');
    if(catalogue[sku]){
      const p = catalogue[sku];
      container.innerHTML = `
        <img src="${p.img}" alt="${p.name}" />
        <h2>${p.name}</h2>
        <div class="price">${p.price}</div>
        <p>${p.desc}</p>
        <button class="buy-btn" onclick="alert('Purchase flow not implemented yet')">Buy Now</button>
      `;
    } else {
      container.innerHTML = `<p>⚠️ Product not found. Please check the SKU or return to the <a href='products.html'>Marketplace</a>.</p>`;
    }
  </script>
</body>
</html>
