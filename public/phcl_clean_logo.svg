<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ocean Blue Glass Gradient -->
    <radialGradient id="oceanBlueGlass" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="1"/>
    </radialGradient>

    <!-- Glowing Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Gold Border Ring -->
  <circle cx="256" cy="256" r="236" fill="url(#oceanBlueGlass)" stroke="url(#goldMetallic)" stroke-width="18" filter="url(#royalGlow)"/>
  
  <!-- Outer Light Ring Accent -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#fde047" stroke-width="3" stroke-dasharray="12, 8" opacity="0.6"/>

  <!-- Bold Wide Letter P in Ocean Blue / Gold Trim -->
  <path d="M 170 110 H 290 C 350 110 390 145 390 205 C 390 265 350 300 290 300 H 240 V 410 H 170 Z M 240 170 V 240 H 285 C 315 240 330 225 330 205 C 330 185 315 170 285 170 Z" 
        fill="url(#goldMetallic)" stroke="#ffffff" stroke-width="4" filter="url(#royalGlow)"/>

  <!-- Pi Symbol Overlay inside P -->
  <text x="256" y="245" font-family="'Outfit', sans-serif" font-weight="900" font-size="75" fill="#ffffff" text-anchor="middle" opacity="0.95">🥧</text>

  <!-- Crown on Top -->
  <path d="M 216 85 L 236 105 L 256 75 L 276 105 L 296 85 L 286 125 H 226 Z" fill="url(#goldMetallic)" stroke="#ffffff" stroke-width="2"/>
</svg>
